<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauge</title>
<style>
  :root { --bg:#faf9f5; --card:#fff; --inset:#f1efe8; --text:#1a1a17; --muted:#74726c; --border:#e3e1d9; --accent:#185fa5; --good:#3b6d11; --warn:#9a5b0b; --bad:#a32d2d; }
  @media (prefers-color-scheme:dark) { :root { --bg:#1d1d1a; --card:#262622; --inset:#31312c; --text:#eceae4; --muted:#aaa89f; --border:#3a3a34; --accent:#85b7eb; --good:#97c459; --warn:#ef9f27; --bad:#f09595; } }
  * { box-sizing:border-box } body { margin:0; padding:24px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif }
  header,.grid { max-width:1200px; margin:auto } header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px } h1 { font-size:20px; margin:0 }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px }.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px }
  .head { display:flex; justify-content:space-between; gap:8px }.head h2 { font-size:15px; margin:0 }.chip { font-size:11px; padding:2px 9px; border-radius:10px; background:var(--inset) }.ok { color:var(--good) }.partial { color:var(--warn) }.error,.err { color:var(--bad) }.meta,.counts { color:var(--muted); font-size:12px }
  .barrow { display:flex; align-items:center; gap:10px; margin-top:10px }.bar { flex:1; height:6px; background:var(--inset); border-radius:4px; overflow:hidden }.bar div { height:100%; background:var(--accent) }.pct { min-width:38px; text-align:right; font-weight:600 }
  .sect { border-top:1px solid var(--border); margin-top:10px; padding-top:8px }.ws { padding:5px 0 }.infobox { background:var(--inset); color:var(--text); padding:7px 9px; border-radius:8px; margin-top:8px }.wtsec { margin-top:7px }.wthdr { font-weight:600; font-size:13px }.stale { opacity:.65 }
  .warn-icon { cursor:help; color:var(--warn); font-weight:700 }.warn-icon:focus { outline:2px solid var(--accent); outline-offset:2px }
  .unknown { color:var(--muted) }.spark { letter-spacing:1px }
  ul { margin:6px 0; padding-left:20px } button { color:inherit; background:var(--card); border:1px solid var(--border); border-radius:7px; padding:4px 10px; cursor:pointer }
  .queue-section { max-width:1200px; margin:0 auto 20px }.queue-section h2 { font-size:14px; margin:0 0 8px }
  .queue { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px }
  .queue-row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 12px }
  .qtier { font-size:11px; font-weight:700; min-width:20px; text-align:center; border-radius:10px; padding:2px 6px; background:var(--inset) }
  .qtier.t1 { color:var(--bad) }.qtier.t2,.qtier.t3 { color:var(--warn) }.qtier.t4,.qtier.t5 { color:var(--good) }
</style>
</head>
<body>
<header><h1>Gauge</h1><div class="meta"><span id="scanned"></span> <button onclick="load()">refresh</button></div></header>
<div class="queue-section"><h2>Attention queue</h2><ol class="queue" id="queue"><li class="meta">ranking portfolio attention…</li></ol></div>
<div class="grid" id="grid"><div class="meta">collecting current observations…</div></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>\"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
// Relative time for the header ("observed 5 minutes ago"), exact timestamp on
// hover via the title attribute. Refreshes on every load() (≤ every 120s).
function relativeTime(date) {
  const seconds = Math.round((date.getTime() - Date.now()) / 1000);
  const abs = Math.abs(seconds);
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  const units = [['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60],['second',1]];
  for (const [unit, secs] of units) { if (abs >= secs || unit === 'second') return rtf.format(Math.round(seconds / secs), unit); }
}
const SIGNAL_VERSIONS = Object.freeze({ repository:1, execution:1, workstreams:1, hygiene:1, narrative:1 });
function signal(p,type) { if(!Object.hasOwn(SIGNAL_VERSIONS,type)) return undefined; return p.signals.find((entry) => entry.type === type && entry.version === SIGNAL_VERSIONS[type]); }
function shorten(value,n=90) { value=String(value); return value.length>n?value.slice(0,n-1)+'…':value; }
function workstreamRow(item) { const steps=item.steps?.total?`${item.steps.done}/${item.steps.total}`:''; const next=item.next?`<div class="counts">Next: ${esc(shorten(item.next.text))}</div>`:''; return `<div class="ws"><b>${esc(item.title||item.path)}</b> <span class="meta">${esc(item.kind)} ${steps}</span>${next}</div>`; }
// 011-03 AC3: discovered checklist workstreams (src/scan.mjs's ≥3-checkbox
// docs, surfaced in the fallback card for projects with no active milestone)
// get a compact title + step-count row, with a "done" treatment applied only
// where inferable — every checkbox checked (steps.total>0 && done===total).
// Where it isn't inferable (no steps, or partial), the item is simply listed,
// never a fabricated status. A pure summarizer (no DOM) so it stays testable
// independent of the row markup, mirroring workstreamRow's title||path
// fallback (no raw path shown once a title exists — AC4).
function summarizeDiscovered(discovered) {
  return (discovered||[]).map((item)=>({ title: item.title||item.path, steps: item.steps, done: Boolean(item.steps?.total) && item.steps.done===item.steps.total }));
}
function discoveredRow(item) { const steps=item.steps?.total?`${item.steps.done}/${item.steps.total}`:''; return `<div class="ws"><b>${esc(item.title)}</b> <span class="meta">${steps}</span>${item.done?' <span class="chip ok">done</span>':''}</div>`; }
// Worktree-only docs are actionable by *worktree* (which session to reopen and
// clean up), not by individual file. Each doc carries its worktree's recency
// `state` and an orthogonal `pushed` flag (ADR-0015); we compose the two into a
// group, order most-actionable first, then group by worktree with the exact
// paths in an expander. `pushed` is a local proxy for an open PR (no GitHub
// call), so a pushed+recent worktree is labelled "likely an open PR" while a
// pushed+quiet one is called out as a probably-landed PR whose worktree lingers.
const WT_GROUP_META = {
  stale:          { label: 'forgotten — local only, no commits in 7 days', color: 'var(--bad)' },
  'pushed-stale': { label: 'pushed but likely done — clean up', color: 'var(--bad)' },
  active:         { label: 'in flight — local only, not pushed', color: 'var(--warn)' },
  review:         { label: 'in review — pushed to a remote branch', color: 'var(--accent)' },
  unknown:        { label: 'state unknown', color: 'var(--muted)' },
};
const WT_GROUP_ORDER = ['stale', 'pushed-stale', 'active', 'review', 'unknown'];
// When a real PR was resolved (ADR-0016), it is authoritative: an open PR is "in
// review", anything else (merged/closed/none) is cleanup. Absent `pr` → fall
// back to the local push-proxy (ADR-0015).
function wtGroup(d) {
  if('pr' in d) return (d.pr && d.pr.state==='OPEN') ? 'review' : 'pushed-stale';
  if(d.state!=='active' && d.state!=='stale') return 'unknown';
  if(d.pushed) return d.state==='stale' ? 'pushed-stale' : 'review';
  return d.state==='stale' ? 'stale' : 'active';
}
function prBadge(pr) {
  if(pr===undefined) return '';
  if(pr===null) return ' <span class="meta">· no open PR</span>';
  return ` · <a href="${esc(pr.url)}" target="_blank" rel="noopener">PR #${esc(pr.number)} ${esc(String(pr.state).toLowerCase())}</a>`;
}
// Plain-text PR descriptor for the ⚠ tooltip (title/aria-label attribute
// text, never markup) — the tooltip counterpart to prBadge's HTML link.
function prText(pr) {
  if(pr===undefined) return '';
  if(pr===null) return ', no PR';
  return pr.state ? `, PR ${String(pr.state).toLowerCase()}` : '';
}
// Cleanup-worthy states used to get their own full-width ⚠ "living only in a
// worktree" box; 011-04 AC3 retires that box — cleanup items now feed the
// header ⚠ icon's tooltip instead (see warningItems below). Healthy
// in-progress work (open PRs, active local branches) keeps its plain-status
// "in progress" box below, unaffected.
const WT_CLEANUP_GROUPS = new Set(['stale', 'pushed-stale', 'unknown']);
// 011-05 HOP 1: every spec id a worktree name encodes, anchored on the
// literal `spec`/`slice` token — a bare 3-digit run (a codename like
// `mystifying-poincare-604`) never matches on its own, so a codename branch
// correctly yields no id (AC1's hop-1 miss, and the false-match guard the
// frame-critique flagged). `spec[-\s]?NNN` chains any further `[-\s]NNN`
// 3-digit runs onto the SAME match (AC2 — `spec-018-019` extracts BOTH ids,
// never truncated to the first). `slice[-\s]?NNN(-NN)?` normalizes to its
// PARENT spec id; the 2-digit slice suffix is captured only to be discarded,
// never counted as a second id. Case-insensitive; deduped, first-appearance
// order (mirrors src/milestone.mjs's extractReferencedSpecNumbers idiom on
// the other side of the join).
function extractBranchSpecIds(name) {
  const text = String(name || '');
  const seen = new Set();
  const ids = [];
  const add = (id) => { if(!seen.has(id)) { seen.add(id); ids.push(id); } };
  const specRe = /\bspec[-\s]?(\d{3})((?:[-\s]\d{3})*)\b/gi;
  let m;
  while ((m = specRe.exec(text))) {
    add(m[1]);
    if (m[2]) for (const n of m[2].match(/\d{3}/g) || []) add(n);
  }
  const sliceRe = /\bslice[-\s]?(\d{3})(?:[-\s]\d{2}\b)?/gi;
  while ((m = sliceRe.exec(text))) add(m[1]);
  return ids;
}
// Reconciliation (011-05): HOP 1 (extractBranchSpecIds) always emits a
// fixed 3-digit id (the branch-name convention), but HOP 2's
// `referencedSpecs` is extractReferencedSpecNumbers's raw `\d+` capture —
// whatever digit run the release prose actually wrote (e.g. an unpadded
// "spec 7"). Joining those two representations by exact string equality
// worked only because every release doc happens to be zero-padded today; an
// unpadded (or differently-padded) reference would silently drop the badge.
// This strips leading zeros to compare, so '007' and '7' resolve to the same
// canonical id — used ONLY at the comparison site below, never to overwrite
// the ids as stored (`specIds`/`referencedSpecs` keep their natural,
// human-authored form for display, e.g. the unassociated "spec 007" note).
function canonicalSpecId(id) {
  return String(id).replace(/^0+(?=\d)/, '');
}
// The project's milestones eligible as a HOP 2 target: the active milestone
// (if any) plus every "next" one — AC3's "active or next" scope. Each
// carries `referencedSpecs` (src/milestone.mjs's attachMilestones, built on
// the SAME extractReferencedSpecNumbers parse as milestoneSpecProgress) so
// this module never reimplements the release→spec parse client-side.
function candidateMilestones(p) {
  const active = p.milestone?.active;
  const next = p.milestone?.next || [];
  return [...(active ? [active] : []), ...next];
}
// 011-05: the single two-hop join used by BOTH worktreeInfo (healthy
// active/review groups) and warningItems (cleanup-worthy groups) — resolving
// the 011-04 review's "worktree grouping duplicated" nit as a byproduct of
// giving the mapping its own testable home. Pure; no DOM. Per worktree
// (deduped across its possibly-many at-risk docs, first doc's `pr` wins —
// same as the pre-011-05 grouping): HOP 1 extracts its spec ids, HOP 2 joins
// them against every candidate milestone's `referencedSpecs`. Set-valued
// (AC1): a worktree whose spec id is referenced by SEVERAL milestones
// contributes an entry to EACH milestone's `worktrees` list, never one
// picked arbitrarily. A worktree with zero matches (hop-1 miss: no spec id
// at all; hop-2 miss: a spec id no candidate milestone references) lands in
// `unassociated` instead, carrying whatever spec ids were found so a hop-2
// miss stays legible (AC5) — a worktree is in exactly one of the two, never
// both.
function worktreeMilestoneMap(p) {
  const hygiene = signal(p,'hygiene');
  const docs = hygiene?.status==='supported' ? (hygiene.value.worktreeOnlyDocs||[]) : [];
  const milestones = candidateMilestones(p);
  const byWt = new Map();
  for (const d of docs) {
    if (byWt.has(d.worktree)) continue;
    byWt.set(d.worktree, { worktree: d.worktree, group: wtGroup(d), pr: d.pr, specIds: extractBranchSpecIds(d.worktree) });
  }
  const mappedByPath = new Map();
  const unassociated = [];
  for (const entry of byWt.values()) {
    const matches = milestones.filter((m) => entry.specIds.some((id) => (m.referencedSpecs||[]).some((ref) => canonicalSpecId(ref) === canonicalSpecId(id))));
    if (!matches.length) { unassociated.push(entry); continue; }
    for (const m of matches) {
      if (!mappedByPath.has(m.path)) mappedByPath.set(m.path, { milestone: { title: m.title, path: m.path }, worktrees: [] });
      mappedByPath.get(m.path).worktrees.push(entry);
    }
  }
  return { mapped: [...mappedByPath.values()], unassociated };
}
// 011-05 AC3/AC5/AC6: healthy (active/review) worktrees, grouped by the
// milestone(s) worktreeMilestoneMap resolves them to — never a flat
// card-level list, and never a file path (the old doc-path `<details>`
// expander is retired along with the per-worktree doc count it depended on).
// A compact PR badge renders on each mapped worktree row (AC3). A healthy
// worktree the join can't place — hop-1 miss (codename) or hop-2 miss (valid
// spec id, unreferenced) — renders in its own clearly-labelled
// "unassociated" section instead of being dropped, showing the encoded spec
// id when there is one (AC5).
function worktreeInfo(p) {
  const { mapped, unassociated } = worktreeMilestoneMap(p);
  const isHealthy = (e) => e.group==='active' || e.group==='review';
  const mappedHealthy = mapped
    .map((entry) => ({ milestone: entry.milestone, worktrees: entry.worktrees.filter(isHealthy) }))
    .filter((entry) => entry.worktrees.length);
  const unassociatedHealthy = unassociated.filter(isHealthy);
  if (!mappedHealthy.length && !unassociatedHealthy.length) return '';
  const wtRow = (e) => `<li><b>${esc(e.worktree)}</b>${prBadge(e.pr)}</li>`;
  const sections = mappedHealthy.map((entry) =>
    `<div class="wtsec"><div class="wthdr">${esc(entry.milestone.title||entry.milestone.path)}</div><ul>${entry.worktrees.map(wtRow).join('')}</ul></div>`
  ).join('');
  const unassocRow = (e) => `<li><b>${esc(e.worktree)}</b>${e.specIds.length?` <span class="meta">spec ${e.specIds.join(', ')}, not in any milestone</span>`:''}${prBadge(e.pr)}</li>`;
  const unassocSection = unassociatedHealthy.length
    ? `<div class="wtsec"><div class="wthdr">unassociated</div><ul>${unassociatedHealthy.map(unassocRow).join('')}</ul></div>`
    : '';
  return `<div class="infobox"><div class="meta">work in progress:</div>${sections}${unassocSection}</div>`;
}
// 011-04 AC1/AC2: pure assembly of the header ⚠ icon's attention items —
// plain language, NEVER a file path — covering a non-ok collection status,
// stale source recency, cleanup-worthy worktree docs (WT_CLEANUP_GROUPS),
// and the "no release plan" gap (mirrors card()'s own `!active` fallback
// rule, the single source of truth for that gap). Empty array ⇒ no icon
// (AC1); a non-empty array becomes the tooltip text (AC2). No DOM, no
// filesystem — testable directly, independent of card()'s render.
//
// 011-05 AC4: cleanup-worthy worktree lines now go through the SAME
// worktreeMilestoneMap join worktreeInfo uses (resolving the 011-04 review's
// "grouping duplicated" nit). A cleanup-worthy worktree that resolves to a
// milestone is attributed to it by name; one the join can't place (either
// hop missing) is explicitly noted "unassociated" right in the tooltip line
// — folded into ⚠ per AC4, never a separate affordance (that's AC5's
// healthy-worktree "unassociated" section in worktreeInfo). Ordered by
// WT_GROUP_ORDER then worktree name for determinism (the old Map-insertion
// order this replaces).
const WT_CLEANUP_LABEL = { stale: 'forgotten', 'pushed-stale': 'pushed but likely done', unknown: 'unknown-state' };
function cleanupWarningLines(p) {
  const { mapped, unassociated } = worktreeMilestoneMap(p);
  const rows = [];
  for (const entry of mapped) for (const w of entry.worktrees) if (WT_CLEANUP_GROUPS.has(w.group)) rows.push({ ...w, milestoneLabel: entry.milestone.title||entry.milestone.path });
  for (const w of unassociated) if (WT_CLEANUP_GROUPS.has(w.group)) rows.push({ ...w, milestoneLabel: null });
  rows.sort((a,b) => WT_GROUP_ORDER.indexOf(a.group)-WT_GROUP_ORDER.indexOf(b.group) || (a.worktree<b.worktree?-1:a.worktree>b.worktree?1:0));
  return rows.map((w) => {
    const dest = w.milestoneLabel ? ` — ${w.milestoneLabel}` : `, unassociated${w.specIds.length?` (spec ${w.specIds.join(', ')})`:''}`;
    return `${WT_CLEANUP_LABEL[w.group]} worktree \`${w.worktree}\`${prText(w.pr)}${dest}`;
  });
}
// 012-02: git commit cadence, attached by the server read layer
// (src/velocity.mjs's attachVelocity) as `p.velocity` — either
// `{ perWeek, buckets }` or `null` (no git, no commits in the window, or an
// unreadable history — explicit unknown, never a fabricated `0` presented as
// healthy, AC4). `sparkline` degrades gracefully on a short/empty bucket
// series (AC3): no bars rather than a crash. Unicode block chars keep this
// zero-dep (ADR-0001) and inline in the stat row (AC3); `esc` still guards
// the numeric headline even though it is server-derived, matching the rest
// of the card's escape-everything convention.
const SPARK_BLOCKS = '▁▂▃▄▅▆▇█';
function sparkline(buckets) {
  if (!Array.isArray(buckets) || !buckets.length) return '';
  const max = Math.max(1, ...buckets);
  return buckets.map((n) => SPARK_BLOCKS[Math.min(SPARK_BLOCKS.length - 1, Math.floor((n / max) * (SPARK_BLOCKS.length - 1)))]).join('');
}
// perWeek is rounded to 1 decimal (velocity.mjs's velocityFromTimestamps), so
// a real-but-sparse rate (e.g. 1 commit over a wide window) can round to
// 0 — that is KNOWN, near-zero activity (the object is non-null), not the
// AC4 unknown state. Displaying it as "≈ 0 commits/wk" would read exactly
// like a fabricated healthy zero, so a rounded-to-zero rate reads "< 0.1"
// instead; any positive value renders normally.
function velocityHeadline(perWeek) {
  return perWeek > 0 ? `≈ ${esc(perWeek)} commits/wk` : '&lt; 0.1 commits/wk';
}
function velocityBlock(p) {
  const v = p.velocity;
  if (!v) return `<div class="counts">velocity <span class="unknown">unknown</span></div>`;
  return `<div class="counts">${velocityHeadline(v.perWeek)} <span class="spark" aria-hidden="true" title="weekly commits, oldest → newest">${esc(sparkline(v.buckets))}</span></div>`;
}
// 012-03: token cost, attached by the server read layer (src/cost.mjs's
// attachTokenCost) as `p.tokenCost` — either `{ totalUsd, hasUnknownModel,
// byModel }` or `null` (no mapped session transcripts — explicit unknown,
// never a fabricated $0, AC4). `byModel` renders as a compact legend (model
// · $amount, sorted priced-first) — an `unknown-model` bucket (AC3) shows
// with no dollar figure of its own and flips the headline into a "at least"
// floor (`$X+`) rather than implying the total is complete.
function fmtUsd(usd) {
  return `$${(Math.round(usd * 100) / 100).toFixed(2)}`;
}
function costLegendEntry(b) {
  return `${esc(b.model)} ${b.usd === null ? '<span class="unknown">unknown</span>' : esc(fmtUsd(b.usd))}`;
}
// Reconciliation: a real, non-zero total that rounds below a cent must never
// render as "$0.00" — that reads as "free", the exact "0-as-healthy" shape
// velocity.mjs's velocityHeadline already guards against (its "< 0.1
// commits/wk" treatment for a real-but-sub-precision rate). "< $0.01" is the
// cost-headline equivalent, mirroring velocityHeadline's own convention of
// embedding the pre-escaped `&lt;` entity directly (never further wrapped in
// esc() by the caller — costBlock below, like velocityBlock, interpolates
// this return value raw). The hasUnknownModel floor marker (`+`) still
// applies on top of either form. True unknown (null tokenCost) is unchanged
// — that stays the literal word "unknown", handled by the caller.
function costHeadline(totalUsd, hasUnknownModel) {
  const rounded = fmtUsd(totalUsd);
  const text = (totalUsd > 0 && rounded === '$0.00') ? '&lt; $0.01' : rounded;
  return hasUnknownModel ? `${text}+` : text;
}
function costBlock(p) {
  const c = p.tokenCost;
  if (!c) return `<div class="counts">cost <span class="unknown">unknown</span></div>`;
  const legend = c.byModel.map(costLegendEntry).join(' · ');
  return `<div class="counts">cost ${costHeadline(c.totalUsd, c.hasUnknownModel)}${legend ? ` <span class="meta">(${legend})</span>` : ''}</div>`;
}
// 012-04: by-activity / by-skill cost breakdown — the spec's DETAIL tier, a
// deliberately deeper cut than everything else on the card (spec.md scope
// boundary). `p.tokenCostBreakdown` is attached by the server read layer
// (src/cost.mjs's attachCostBreakdown) as `{byActivity, bySkill}` (each an
// array of `{activity|skill, totalUsd, hasUnknownModel, byModel}` buckets,
// always including an explicit `unattributed` bucket — AC5) or `null` (no
// mapped transcripts, same honest-unknown contract as tokenCost itself).
// Rendered inside a collapsed `<details>`, OUTSIDE the compact stat row
// (costBlock above) it sits next to — the card face itself is unchanged
// (AC3). With no breakdown data at all, nothing renders (mirrors
// forecastBlock/narrativeBlock's own "absent -> empty" convention; the
// headline `costBlock` already carries the "unknown" messaging).
function costBreakdownRow(bucket, labelKey) {
  const legend = bucket.byModel.map(costLegendEntry).join(' · ');
  return `<div class="counts">${esc(bucket[labelKey])}: ${costHeadline(bucket.totalUsd, bucket.hasUnknownModel)}${legend ? ` <span class="meta">(${legend})</span>` : ''}</div>`;
}
function costDetailBlock(p) {
  const d = p.tokenCostBreakdown;
  if (!d) return '';
  const activityRows = (d.byActivity || []).map((b) => costBreakdownRow(b, 'activity')).join('');
  const skillRows = (d.bySkill || []).map((b) => costBreakdownRow(b, 'skill')).join('');
  if (!activityRows && !skillRows) return '';
  return `<details class="sect"><summary class="meta">cost detail: by activity · by skill</summary>
    <div class="wtsec"><span class="wthdr">by activity</span>${activityRows}</div>
    <div class="wtsec"><span class="wthdr">by skill</span>${skillRows}</div>
  </details>`;
}
function warningItems(p) {
  const items=[];
  if(p.collection?.status && p.collection.status!=='ok') {
    const detail=(p.errors||[]).map((e)=>e.message).join(' · ');
    items.push(`collection ${p.collection.status}${detail?': '+detail:''}`);
  }
  const repository=signal(p,'repository');
  if(repository?.freshness?.state==='stale') items.push('repository stale — no recent commits');
  items.push(...cleanupWarningLines(p));
  if(!p.milestone?.active) items.push('no release plan — overall spec progress only');
  return items;
}
function card(p) {
  const execution=signal(p,'execution'), workstreams=signal(p,'workstreams'), narrative=signal(p,'narrative'), repository=signal(p,'repository');
  const progress=execution?.status==='supported'?execution.value.progress:null;
  const items=workstreams?.status==='supported'?(workstreams.value.items||[]):[];
  const discoveredItems=workstreams?.status==='supported'?(workstreams.value.discovered||[]):[];
  const streams=[...items,...discoveredItems];
  const problems=(p.errors||[]).map((error)=>esc(error.message)).join(' · ');
  // Active/next milestone (spec 011-01): attached by the server read layer
  // (src/milestone.mjs's attachMilestones) as {active, next} over the
  // project's release-plan workstreams. The active milestone's title IS the
  // goal line — the project-description goal (ADR-0011 prose) is no longer
  // rendered here (AC3). Its appetite renders inline as timebox text; absent
  // or "TBD" reads the literal `unknown`, never a fabricated date or blank
  // (AC4). With no active milestone (AC6 — e.g. no release plan, or every
  // release shipped/dropped), this block renders nothing; 011-03 adds the
  // fallback card face for that case.
  const active=p.milestone?.active;
  const nextMilestones=p.milestone?.next||[];
  const milestoneBlock=active?`<div class="meta">Goal: ${esc(active.title||active.path)} · Timebox: ${esc(active.appetite||'unknown')}${nextMilestones.length?` · Next: ${nextMilestones.map((m)=>esc(m.title||m.path)).join(', ')}`:''}</div>`:'';
  // 011-03 AC1/AC2: fallback layout for a project with no active milestone
  // (no release plan, or none yielding active/next) — a labelled note so the
  // project-global bar below (already the fallback value of barProgress,
  // unchanged from 011-02) is never mistaken for milestone progress. Gated
  // strictly on `!active`, so a milestone WITH an active release but an
  // unresolved specProgress (011-02's own fallback-to-global case) never
  // shows this "no release plan" note — that project does have a release
  // plan, just no resolvable spec refs.
  const fallbackNote=active?'':`<div class="meta">No release plan — overall spec progress.</div>`;
  // Milestone-scoped progress (spec 011-02): the active milestone's own bar,
  // rolled up by src/milestone.mjs's milestoneSpecProgress (done/denom over
  // the release doc's referenced PARENT specs, via the same progressOf rule
  // as the project-global bar below — never a second rule). AC4: a milestone
  // whose specProgress is null (no resolvable `spec NNN` refs) or whose
  // denom is 0 (every resolved ref abandoned — nothing left to measure)
  // falls back to the project-global `progress` bar, never a fabricated 0%.
  const milestoneProgress=active?.specProgress?.denom>0?active.specProgress:null;
  const barProgress=milestoneProgress||progress;
  const barPct=barProgress?.pct??null;
  // Forecast/risk (spec 009-02, ADR-0006/ADR-0012): attached by the server
  // read layer as {state, reason}. `unknown` is an explicit, legible state —
  // rendered the same way as a colour, never blank and never a green default.
  const forecast=p.forecast;
  const FORECAST_CLASS={on_track:'ok',at_risk:'error',unknown:'partial'};
  const forecastBlock=forecast?`<div class="meta"><span class="chip ${esc(FORECAST_CLASS[forecast.state]||'')}">forecast: ${esc(forecast.state)}</span> ${esc(forecast.reason)}</div>`:'';
  const narrativeBlock=narrative?.status==='supported'?`<div class="sect ${narrative.freshness.state==='stale'?'stale':''}"><span class="meta">legacy narrative · ${esc(narrative.freshness.state)}</span><br>${esc(narrative.value.headline)}</div>`:'';
  // Only flag genuine collection problems. A green "ok" chip made bare-git
  // projects look healthier than fully-instrumented ones; absence of a chip now
  // means "collected cleanly", and partial/error surface as a warning.
  const statusChip=p.collection.status==='ok'?'':`<span class="chip ${esc(p.collection.status)}">${esc(p.collection.status)}</span>`;
  // Surface source recency (derived from git), so a quiet repo is legible as
  // stale instead of silently reading the same as one touched today.
  const git=repository?.status==='supported'?repository.value.git:null;
  const repoState=repository?.freshness?.state;
  // Per-card meta no longer repeats "repository observed · <collectedAt>": the
  // header already shows one global observed time. What stays is per-project and
  // non-redundant — source recency (last commit / stale), or an explicit
  // "repository unavailable" when the repository signal is missing.
  const recency=git?`last commit ${esc(git.lastCommit)}${repoState==='stale'?' <span style="color:var(--warn)">(stale)</span>':''}`:(repoState==='unknown'?'<span style="color:var(--muted)">recency unknown</span>':'');
  const metaLine=repository?.status==='supported'?recency:'<span class="partial">repository unavailable</span>';
  // 011-04 AC1/AC2/AC4: the header ⚠ icon replaces the old top warnings block
  // — present only when warningItems has something to report, keyboard-
  // reachable (tabindex + role="img") with its accessible name/tooltip in
  // both aria-label and title so it's never hover-only.
  const warnings=warningItems(p);
  const warnTooltip=warnings.join(' · ');
  const warnIcon=warnings.length?`<span class="warn-icon" tabindex="0" role="img" aria-label="${esc('Attention needed: '+warnTooltip)}" title="${esc(warnTooltip)}">⚠</span>`:'';
  return `<article class="card"><div class="head"><h2>${esc(p.project.label)}</h2>${warnIcon}${statusChip}</div>
    ${metaLine?`<div class="counts">${metaLine}</div>`:''}
    ${velocityBlock(p)}
    ${costBlock(p)}
    ${milestoneBlock}${fallbackNote}
    ${forecastBlock}
    ${barProgress?`<div class="barrow"><div class="bar"><div style="width:${barPct??0}%"></div></div><span class="pct">${barPct===null?'—':barPct+'%'}</span></div><div class="counts">${barProgress.done} / ${barProgress.denom} specs${milestoneProgress?'':' done'}${barProgress.deferred?` · ${barProgress.deferred} deferred`:''}</div>`:`<p class="counts">Execution signal ${esc(execution?.status||'unknown')}.</p>`}
    ${active
      ? (streams.length?`<div class="sect"><span class="meta">workstreams</span>${streams.map(workstreamRow).join('')}</div>`:'')
      : ((items.length||discoveredItems.length)?`<div class="sect"><span class="meta">workstreams</span>${items.map(workstreamRow).join('')}${summarizeDiscovered(discoveredItems).map(discoveredRow).join('')}</div>`:'')}
    ${worktreeInfo(p)}
    ${narrativeBlock}${problems?`<p class="err">${problems}</p>`:''}
    ${costDetailBlock(p)}</article>`;
}
function safeCard(project) { try { return card(project); } catch(error) { const label=project?.project?.label||project?.project?.id||'malformed project'; return `<article class="card"><div class="head"><h2>${esc(label)}</h2><span class="chip error">error</span></div><p class="err">Invalid project observation: ${esc(error?.message||error)}</p></article>`; } }
// Global attention queue (spec 009-03, ADR-0013): a single ranked, explained
// cross-project ordering — "which project deserves attention next, and why"
// — rendered in its own region, distinct from the per-project cards below.
// The server (src/derive.mjs attentionQueue) already computed tier + reason;
// this only renders the already-ranked list, never re-sorts or re-derives.
function queueRow(item) { return `<li class="queue-row"><span class="qtier t${esc(item.tier)}">${esc(item.tier)}</span><b>${esc(item.label||item.id)}</b><span class="meta">${esc(item.reason)}</span></li>`; }
function safeQueueRow(item) { try { return queueRow(item); } catch(error) { return `<li class="queue-row err">Invalid attention entry: ${esc(error?.message||error)}</li>`; } }
async function load() { try { const response=await fetch('/api/data'); const data=await response.json(); if(data.error) throw new Error(data.error); const scanned=document.getElementById('scanned'); const observedAt=new Date(data.generatedAt); scanned.textContent='observed '+relativeTime(observedAt); scanned.title=observedAt.toLocaleString(); document.getElementById('grid').innerHTML=data.projects.map(safeCard).join(''); document.getElementById('queue').innerHTML=(data.attention||[]).map(safeQueueRow).join('')||'<li class="meta">no projects to rank yet</li>'; } catch(error) { document.getElementById('grid').innerHTML=`<p class="err">${esc(error.message)}</p>`; } }
load(); setInterval(load,120000);
</script>
</body>
</html>
