<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauge</title>
<style>
  :root { --bg:#faf9f5; --card:#fff; --inset:#f1efe8; --text:#1a1a17; --muted:#74726c; --border:#e3e1d9; --accent:#185fa5; --good:#3b6d11; --warn:#9a5b0b; --bad:#a32d2d; }
  @media (prefers-color-scheme:dark) { :root { --bg:#1d1d1a; --card:#262622; --inset:#31312c; --text:#eceae4; --muted:#aaa89f; --border:#3a3a34; --accent:#85b7eb; --good:#97c459; --warn:#ef9f27; --bad:#f09595; } }
  * { box-sizing:border-box } body { margin:0; padding:24px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif }
  header,.grid { max-width:1200px; margin:auto } header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px } h1 { font-size:20px; margin:0 }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px }.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px }
  .head { display:flex; justify-content:space-between; gap:8px }.head h2 { font-size:15px; margin:0 }.chip { font-size:11px; padding:2px 9px; border-radius:10px; background:var(--inset) }.ok { color:var(--good) }.partial { color:var(--warn) }.error,.err { color:var(--bad) }.meta,.counts { color:var(--muted); font-size:12px }
  .barrow { display:flex; align-items:center; gap:10px; margin-top:10px }.bar { flex:1; height:6px; background:var(--inset); border-radius:4px; overflow:hidden }.bar div { height:100%; background:var(--accent) }.pct { min-width:38px; text-align:right; font-weight:600 }
  .sect { border-top:1px solid var(--border); margin-top:10px; padding-top:8px }.ws { padding:5px 0 }.warnbox { background:color-mix(in srgb,var(--warn) 14%,transparent); color:var(--warn); padding:7px 9px; border-radius:8px }.stale { opacity:.65 }
  ul { margin:6px 0; padding-left:20px } button { color:inherit; background:var(--card); border:1px solid var(--border); border-radius:7px; padding:4px 10px; cursor:pointer }
  .queue-section { max-width:1200px; margin:0 auto 20px }.queue-section h2 { font-size:14px; margin:0 0 8px }
  .queue { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px }
  .queue-row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 12px }
  .qtier { font-size:11px; font-weight:700; min-width:20px; text-align:center; border-radius:10px; padding:2px 6px; background:var(--inset) }
  .qtier.t1 { color:var(--bad) }.qtier.t2,.qtier.t3 { color:var(--warn) }.qtier.t4,.qtier.t5 { color:var(--good) }
</style>
</head>
<body>
<header><h1>Gauge</h1><div class="meta"><span id="scanned"></span> <button onclick="load()">refresh</button></div></header>
<div class="queue-section"><h2>Attention queue</h2><ol class="queue" id="queue"><li class="meta">ranking portfolio attention…</li></ol></div>
<div class="grid" id="grid"><div class="meta">collecting current observations…</div></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>\"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
// Relative time for the header ("observed 5 minutes ago"), exact timestamp on
// hover via the title attribute. Refreshes on every load() (≤ every 120s).
function relativeTime(date) {
  const seconds = Math.round((date.getTime() - Date.now()) / 1000);
  const abs = Math.abs(seconds);
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  const units = [['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60],['second',1]];
  for (const [unit, secs] of units) { if (abs >= secs || unit === 'second') return rtf.format(Math.round(seconds / secs), unit); }
}
const SIGNAL_VERSIONS = Object.freeze({ repository:1, execution:1, workstreams:1, hygiene:1, narrative:1 });
function signal(p,type) { if(!Object.hasOwn(SIGNAL_VERSIONS,type)) return undefined; return p.signals.find((entry) => entry.type === type && entry.version === SIGNAL_VERSIONS[type]); }
function shorten(value,n=90) { value=String(value); return value.length>n?value.slice(0,n-1)+'…':value; }
function workstreamRow(item) { const steps=item.steps?.total?`${item.steps.done}/${item.steps.total}`:''; const next=item.next?`<div class="counts">Next: ${esc(shorten(item.next.text))}</div>`:''; return `<div class="ws"><b>${esc(item.title||item.path)}</b> <span class="meta">${esc(item.kind)} ${steps}</span>${next}</div>`; }
// Worktree-only docs are actionable by *worktree* (which session to reopen and
// clean up), not by individual file — so group the count by worktree name and
// lead with that. The exact paths stay available in an expander.
function worktreeWarn(docs) {
  if(!docs.length) return '';
  const byWt=new Map();
  for(const d of docs){ if(!byWt.has(d.worktree)) byWt.set(d.worktree,[]); byWt.get(d.worktree).push(d.path); }
  const groups=[...byWt.entries()].sort((a,b)=>b[1].length-a[1].length);
  const rows=groups.map(([wt,paths])=>`<li><b>${esc(wt)}</b> <span class="meta">${paths.length} doc${paths.length===1?'':'s'}</span><details><summary class="meta">paths</summary><ul>${paths.map((p)=>`<li>${esc(p)}</li>`).join('')}</ul></details></li>`).join('');
  const total=docs.length, nWt=byWt.size;
  return `<div class="warnbox">⚠ ${total} document${total===1?'':'s'} exist only in ${nWt===1?'a worktree':nWt+' worktrees'} (unmerged; would be lost if the worktree is deleted)<ul>${rows}</ul></div>`;
}
function card(p) {
  const execution=signal(p,'execution'), workstreams=signal(p,'workstreams'), hygiene=signal(p,'hygiene'), narrative=signal(p,'narrative'), repository=signal(p,'repository');
  const progress=execution?.status==='supported'?execution.value.progress:null;
  const pct=progress?.pct??null;
  const specs=execution?.status==='supported'?execution.value.items:[];
  const rows=specs.map((item)=>`<li>${esc(item.id)} <span class="meta">${esc(item.status||'unknown')}</span></li>`).join('');
  const streams=workstreams?.status==='supported'?[...(workstreams.value.items||[]),...(workstreams.value.discovered||[])]:[];
  const worktreeOnly=hygiene?.status==='supported'?(hygiene.value.worktreeOnlyDocs||[]):[];
  const problems=(p.errors||[]).map((error)=>esc(error.message)).join(' · ');
  // Goal/deadline (spec 009-01, ADR-0011): joined onto p.project by the
  // server read layer (never derived here from prose) — echoed verbatim, or
  // an explicit "no goal/deadline set" affordance when absent. A deadline
  // authored as the literal "unknown" renders "Deadline: unknown" — never a
  // fabricated date and never blank.
  const goal=p.project.goal;
  const deadline=p.project.deadline;
  const goalLine=goal&&goal.value?`Goal: ${esc(goal.value)}`:'no goal set';
  const deadlineLine=deadline&&deadline.value?`Deadline: ${esc(deadline.value)}`:'no deadline set';
  const goalDeadlineBlock=`<div class="meta">${goalLine} · ${deadlineLine}</div>`;
  // Forecast/risk (spec 009-02, ADR-0006/ADR-0012): attached by the server
  // read layer as {state, reason}. `unknown` is an explicit, legible state —
  // rendered the same way as a colour, never blank and never a green default.
  const forecast=p.forecast;
  const FORECAST_CLASS={on_track:'ok',at_risk:'error',unknown:'partial'};
  const forecastBlock=forecast?`<div class="meta"><span class="chip ${esc(FORECAST_CLASS[forecast.state]||'')}">forecast: ${esc(forecast.state)}</span> ${esc(forecast.reason)}</div>`:'';
  const narrativeBlock=narrative?.status==='supported'?`<div class="sect ${narrative.freshness.state==='stale'?'stale':''}"><span class="meta">legacy narrative · ${esc(narrative.freshness.state)}</span><br>${esc(narrative.value.headline)}</div>`:'';
  // Only flag genuine collection problems. A green "ok" chip made bare-git
  // projects look healthier than fully-instrumented ones; absence of a chip now
  // means "collected cleanly", and partial/error surface as a warning.
  const statusChip=p.collection.status==='ok'?'':`<span class="chip ${esc(p.collection.status)}">${esc(p.collection.status)}</span>`;
  // Surface source recency (derived from git), so a quiet repo is legible as
  // stale instead of silently reading the same as one touched today.
  const git=repository?.status==='supported'?repository.value.git:null;
  const repoState=repository?.freshness?.state;
  // Per-card meta no longer repeats "repository observed · <collectedAt>": the
  // header already shows one global observed time. What stays is per-project and
  // non-redundant — source recency (last commit / stale), or an explicit
  // "repository unavailable" when the repository signal is missing.
  const recency=git?`last commit ${esc(git.lastCommit)}${repoState==='stale'?' <span style="color:var(--warn)">(stale)</span>':''}`:(repoState==='unknown'?'<span style="color:var(--muted)">recency unknown</span>':'');
  const metaLine=repository?.status==='supported'?recency:'<span class="partial">repository unavailable</span>';
  return `<article class="card"><div class="head"><h2>${esc(p.project.label)}</h2>${statusChip}</div>
    ${metaLine?`<div class="counts">${metaLine}</div>`:''}
    ${goalDeadlineBlock}
    ${forecastBlock}
    ${progress?`<div class="barrow"><div class="bar"><div style="width:${pct??0}%"></div></div><span class="pct">${pct===null?'—':pct+'%'}</span></div><div class="counts">${progress.done}/${progress.denom} specs done${progress.deferred?` · ${progress.deferred} deferred`:''}</div>`:`<p class="counts">Execution signal ${esc(execution?.status||'unknown')}.</p>`}
    ${rows?`<details><summary>specs</summary><ul>${rows}</ul></details>`:''}
    ${streams.length?`<div class="sect"><span class="meta">workstreams</span>${streams.map(workstreamRow).join('')}</div>`:''}
    ${worktreeWarn(worktreeOnly)}
    ${narrativeBlock}${problems?`<p class="err">${problems}</p>`:''}</article>`;
}
function safeCard(project) { try { return card(project); } catch(error) { const label=project?.project?.label||project?.project?.id||'malformed project'; return `<article class="card"><div class="head"><h2>${esc(label)}</h2><span class="chip error">error</span></div><p class="err">Invalid project observation: ${esc(error?.message||error)}</p></article>`; } }
// Global attention queue (spec 009-03, ADR-0013): a single ranked, explained
// cross-project ordering — "which project deserves attention next, and why"
// — rendered in its own region, distinct from the per-project cards below.
// The server (src/derive.mjs attentionQueue) already computed tier + reason;
// this only renders the already-ranked list, never re-sorts or re-derives.
function queueRow(item) { return `<li class="queue-row"><span class="qtier t${esc(item.tier)}">${esc(item.tier)}</span><b>${esc(item.label||item.id)}</b><span class="meta">${esc(item.reason)}</span></li>`; }
function safeQueueRow(item) { try { return queueRow(item); } catch(error) { return `<li class="queue-row err">Invalid attention entry: ${esc(error?.message||error)}</li>`; } }
async function load() { try { const response=await fetch('/api/data'); const data=await response.json(); if(data.error) throw new Error(data.error); const scanned=document.getElementById('scanned'); const observedAt=new Date(data.generatedAt); scanned.textContent='observed '+relativeTime(observedAt); scanned.title=observedAt.toLocaleString(); document.getElementById('grid').innerHTML=data.projects.map(safeCard).join(''); document.getElementById('queue').innerHTML=(data.attention||[]).map(safeQueueRow).join('')||'<li class="meta">no projects to rank yet</li>'; } catch(error) { document.getElementById('grid').innerHTML=`<p class="err">${esc(error.message)}</p>`; } }
load(); setInterval(load,120000);
</script>
</body>
</html>
